[project]
name = "glassbox"
version = "0.1.0"
description = "White-box AutoML library"

# Runtime dependencies
# Install with `pip install .`
dependencies = [
    "numpy",
]

# Dev dependencies
# Install with `pip install .[dev]`
[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mkdocs<2",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
]

[tool.setuptools.packages.find]
include = [
    "glassbox",
]

[tool.black]
line-length = 90
target-version = ["py311"]

[tool.ruff]
ignore = ["E501"]
select = ["E", "F", "W", "I"]
fix = true
